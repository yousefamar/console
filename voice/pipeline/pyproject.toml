[project]
name = "al-voice-pipeline"
version = "0.1.0"
description = "AL's WhatsApp voice pipeline: Pipecat over the wa-voice sidecar (Cartesia Ink STT, the AL voice fork via the hub, Cartesia TTS in Yousef's clone)"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[cartesia,silero,openai]>=1.11.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "py3langid>=0.4",
]

[project.scripts]
al-voice-pipeline = "al_voice.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["al_voice"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
