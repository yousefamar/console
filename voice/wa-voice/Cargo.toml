[package]
name = "wa-voice"
version = "0.1.0"
edition = "2024"
publish = false
description = "WhatsApp voice-call sidecar for the Console hub: linked device #2 on AL's account, calls over a local WebSocket as 16 kHz PCM"

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-channel = "2"
bytes = "1"
env_logger = "0.11"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
whatsapp-rust = { git = "https://github.com/yousefamar/whatsapp-rust.git", rev = "8b78151c", default-features = false, features = [
    "sqlite-storage",
    "sqlite-storage-bundled",
    "tokio-transport",
    "ureq-client",
    "tokio-native",
    "signal",
    "voip-mlow",
    "voip-libopus",
    "voip-relay-native",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# `rev 8b78151c` = upstream `908e62b6` (the rev this ran on until 3 Oct 2026) plus one commit:
# wacore's MLow encoder now codes silence as INACTIVE frames (TOC 0x10, 0x12 for the DTX hangover)
# instead of flagging every frame as active voice. Upstream issue oxidezap/whatsapp-rust#1615,
# PR #1616, MERGED 2026-10-03 as upstream 99a9a118. Any upstream rev at or after 99a9a118
# carries it, so the next upstream bump drops this fork.
