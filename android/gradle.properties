org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# No resident daemon: it held 3.6 GB (+1.6 GB Kotlin) long after a release
# build, on a box that runs the whole agent fleet (Astera's RAM guard, 5 Oct
# 2026: 0 GB free / 7 GB swap / load 25). Builds pay ~40 s of JVM+config
# startup instead. Flip back to true only if the fleet stops sharing this host.
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
